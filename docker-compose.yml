version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://neon_user:secret_password@postgres_db:5432/neon_nexus
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  postgres_db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: neon_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: neon_nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neon_user -d neon_nexus"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
